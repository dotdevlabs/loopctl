  /api/tasks/{task_id}/todos:
    get:
      operationId: get-api-task-todos
      summary: Lists saved todos for a task, ordered by position then ID.
      description: >-
        Available in every task lifecycle state, with or without an assigned container.
        Omitted or blank stage_name returns all saved stages. A supplied nonblank string
        matches the exact stored stage name, including historical stages absent from the
        current pipeline; unknown names return an empty list. Arrays and objects are invalid.
        Pagination links preserve the stage filter. Page numbers of zero clamp to one;
        page sizes clamp to 1–100. Negative, nonnumeric, or structured pagination values
        are invalid; page itself must be an object.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
        - { name: stage_name, in: query, schema: { type: string } }
        - { name: "page[number]", in: query, schema: { type: integer, default: 1 } }
        - { name: "page[size]", in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated list of todos
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/TodoAttributes'
                  links:
                    $ref: '#/components/schemas/JsonApiLinks'
                  meta:
                    $ref: '#/components/schemas/JsonApiPaginationMeta'
        '400':
          description: Invalid pagination parameter or non-string stage_name
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '401':
          description: Missing or invalid bearer token
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '404':
          description: Task not found in the authenticated account
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
    post:
      operationId: post-api-task-todos
      summary: Creates one or more todos for a task.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                todo:
                  type: object
                  description: "Single todo object: { content, active_form, status, position, stage_name }"
                todos:
                  type: array
                  items: { type: object }
                  description: "Array of todo objects"
      responses:
        '201':
          description: Created todos (data array)
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/TodoCreateResponseAttributes'
        '400':
          description: Neither 'todo' nor 'todos' was provided
        '422':
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'

