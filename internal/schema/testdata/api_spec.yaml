openapi: "3.0.3"
info:
  title: LoopControl API
  version: "1.0.0"
  description: API for managing containerized agent environments on a Kubernetes cluster.

servers:
  - url: /

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    JsonApiResource:
      type: object
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          type: object
        relationships:
          type: object
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string
              nullable: true

    JsonApiLinks:
      type: object
      required: [self, first, last]
      properties:
        self: { type: string }
        first: { type: string }
        last: { type: string }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }

    JsonApiPaginationMeta:
      type: object
      required: [total_count, page_count, current_page, per_page]
      properties:
        total_count: { type: integer }
        page_count: { type: integer }
        current_page: { type: integer }
        per_page: { type: integer }

    JsonApiErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              detail: { type: string }
              source: { type: object }

    JsonApiToOneRelationship:
      type: object
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }

    JsonApiNullableToOneRelationship:
      type: object
      properties:
        data:
          nullable: true
          type: object
          properties:
            type: { type: string }
            id: { type: string }

    AgentAttributes:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }

    PlatformAttributes:
      type: object
      properties:
        name: { type: string }
        display_name: { type: string }
        container_image: { type: string }
        needs_database: { type: boolean }
        port: { type: integer }
        built_in: { type: boolean }

    TaskKindAttributes:
      type: object
      properties:
        name: { type: string }
        built_in: { type: boolean }
        account_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PipelineStageTrigger:
      type: object
      properties:
        timing:  { type: string, enum: [before_entry, after_entry, before_exit, after_exit] }
        handler: { type: string, description: "Ruby constant of the handler class." }
        config:  { type: object }

    PipelineStage:
      type: object
      description: A single workflow stage as returned in pipeline responses.
      properties:
        id:                         { type: string }
        stage_type:                 { type: string }
        custom_stage_name:          { type: string, nullable: true }
        gate:                       { type: string, enum: [automated, human] }
        on_failure:                 { type: string, enum: [rework, block] }
        max_rework_count:           { type: integer, nullable: true }
        rework_to_position:         { type: integer, nullable: true }
        position:                   { type: integer }
        agent_id:                   { type: string, nullable: true }
        environment_id:             { type: string, nullable: true }
        advance_requirements:       { type: array, items: { type: object } }
        advance_notice:             { type: string, nullable: true }
        branch_conditions:          { type: array, items: { type: object } }
        runs_in_container_override: { type: boolean, nullable: true }
        prompt_sections:            { type: object }
        stage_triggers:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStageTrigger'
        name:         { type: string, nullable: true, description: "Deprecated: same as custom_stage_name." }
        role:         { type: string, description: "Deprecated: always 'working'." }
        instructions: { type: string, description: "Deprecated: same as prompt_sections.template." }

    PipelineStageInput:
      type: object
      description: >-
        Full stage attribute set for pipeline create/update. stage_type defaults to "custom".
        For custom stages custom_stage_name (or legacy name) and a prompt template
        (prompt_sections.template or legacy instructions) are required.
      properties:
        stage_type:                 { type: string, description: "Stage type name. Defaults to 'custom'." }
        custom_stage_name:          { type: string }
        prompt_sections:            { type: object }
        gate:                       { type: string, enum: [automated, human] }
        on_failure:                 { type: string, enum: [rework, block] }
        max_rework_count:           { type: integer }
        rework_to_position:         { type: integer }
        position:                   { type: integer }
        agent_id:                   { type: integer }
        environment_id:             { type: integer }
        advance_requirements:       { type: array, items: { type: object } }
        advance_notice:             { type: string }
        branch_conditions:
          type: array
          items:
            type: object
            properties:
              field:         { type: string }
              op:            { type: string, enum: [eq, ne, gt, lt, gte, lte, in, not_in] }
              value:         {}
              next_position: { type: integer }
        runs_in_container_override: { type: boolean, nullable: true }
        stage_triggers:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStageTrigger'
        name:         { type: string, description: "Deprecated: use custom_stage_name." }
        role:         { type: string, enum: [working], description: "Deprecated: use stage_type: 'custom'." }
        instructions: { type: string, description: "Deprecated: use prompt_sections.template." }

    PipelineAttributes:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        built_in: { type: boolean }
        kind: { type: string }
        task_kind_id: { type: string }
        account_id: { type: string }
        stage_count: { type: integer }
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PipelineUpdateResponseAttributes:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        built_in: { type: boolean }
        kind: { type: string }
        task_kind_id: { type: string }
        account_id: { type: string }
        stage_count: { type: integer }
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'

    PipelineCloneResponseAttributes:
      type: object
      properties:
        name: { type: string }
        built_in: { type: boolean }
        stage_count: { type: integer }

    ProjectAttributes:
      type: object
      properties:
        name: { type: string }
        display_name: { type: string }
        git_repo_url: { type: string }
        git_branch: { type: string }
        default_branch: { type: string }
        port: { type: integer }
        bootstrapping: { type: boolean }
        pipeline_name: { type: string, nullable: true }
        active_tasks_count: { type: integer }
        tasks_completed_today: { type: integer }
        tasks_completed_last_7_days: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectCreateResponseAttributes:
      type: object
      properties:
        name: { type: string }
        display_name: { type: string }
        git_repo_url: { type: string }
        git_branch: { type: string }
        default_branch: { type: string }
        bootstrapping: { type: boolean }

    ProjectUpdateResponseAttributes:
      type: object
      properties:
        display_name: { type: string }
        git_branch: { type: string }
        pipeline_name: { type: string, nullable: true }

    ContainerAttributes:
      type: object
      properties:
        uid: { type: string }
        status: { type: string }
        agent_status: { type: string }
        status_message: { type: string }
        error_context: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskListAttributes:
      type: object
      properties:
        title: { type: string }
        kind: { type: string }
        prompt_hash: { type: string }
        pr_number: { type: integer }
        pr_url: { type: string }
        description: { type: string }
        pr_merged_at: { type: string, format: date-time }
        merge_commit_sha: { type: string }
        ci_status: { type: string }
        ci_status_url: { type: string }
        code_review_status: { type: string }
        blocked_reason: { type: string }
        completed_at: { type: string, format: date-time }
        picked_up_at: { type: string, format: date-time }
        project_id: { type: string }
        stage: { type: string }
        current_state: { type: string }
        status: { type: string }
        depends_on:
          type: array
          items: { type: string }
        dependencies_met: { type: boolean }
        blocking_dependency_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskShowAttributes:
      type: object
      properties:
        title: { type: string }
        kind: { type: string }
        stage: { type: string }
        current_state: { type: string }
        status: { type: string }
        project_id: { type: string }
        prompt_hash: { type: string }
        pr_number: { type: integer }
        pr_url: { type: string }
        description: { type: string }
        pr_merged_at: { type: string, format: date-time }
        merge_commit_sha: { type: string }
        ci_status: { type: string }
        ci_status_url: { type: string }
        code_review_status: { type: string }
        blocked_reason: { type: string }
        completed_at: { type: string, format: date-time }
        picked_up_at: { type: string, format: date-time }
        depends_on:
          type: array
          items: { type: string }
        dependencies_met: { type: boolean }
        blocking_dependency_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskCreateResponseAttributes:
      type: object
      properties:
        title: { type: string }
        kind: { type: string }
        stage: { type: string }
        project_id: { type: string }
        depends_on:
          type: array
          items: { type: string }
        dependencies_met: { type: boolean }

    TaskUpdateResponseAttributes:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        stage: { type: string }

    RecordingAttributes:
      type: object
      properties:
        recording_type: { type: string }
        filename: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration: { type: integer }
        size_bytes: { type: integer }
        file_available: { type: boolean }
        deleted_at: { type: string, format: date-time }
        content_url: { type: string }
        container_id: { type: string }
        stage_name: { type: string }
        created_at: { type: string, format: date-time }

    RecordingCreateResponseAttributes:
      type: object
      properties:
        recording_type: { type: string }
        filename: { type: string }

    CommentAttributes:
      type: object
      properties:
        body: { type: string }
        comment_type: { type: string }
        created_at: { type: string, format: date-time }

    TodoAttributes:
      type: object
      properties:
        content: { type: string }
        active_form: { type: string }
        status:
          type: string
          enum: [pending, in_progress, completed]
        position: { type: integer }
        stage_name: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TodoCreateResponseAttributes:
      type: object
      properties:
        content: { type: string }
        active_form: { type: string }
        status: { type: string }
        position: { type: integer }
        stage_name: { type: string }

    TodoUpdateResponseAttributes:
      type: object
      properties:
        content: { type: string }
        status: { type: string }
        position: { type: integer }
        updated_at: { type: string, format: date-time }

    TransitionAttributes:
      type: object
      properties:
        from_stage: { type: string }
        to_stage: { type: string }
        custom_stage_name: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    ActivityAttributes:
      type: object
      properties:
        action: { type: string }
        details: { type: string }
        metadata: { type: object }
        container_id: { type: string }
        created_at: { type: string, format: date-time }

    FlowRegistryFlowAttributes:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: object } }
        assertions: { type: array, items: { type: object } }
        baseline_commit_sha: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountPipelineDefaultAttributes:
      type: object
      properties:
        kind: { type: string }
        pipeline_id: { type: string }
        task_kind_id: { type: string }
        account_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TopupPackageAttributes:
      type: object
      properties:
        hours: { type: integer }
        price_cents: { type: integer }

    TopupCheckoutAttributes:
      type: object
      properties:
        package_id: { type: string }
        checkout_url: { type: string }
        hours: { type: integer }
        price_cents: { type: integer }

    StatusAttributes:
      type: object
      properties:
        version:
          type: string
          nullable: true
          description: Application version injected at build time via ARG; null when unset.
        sha:
          type: string
          nullable: true
          description: Git SHA injected at build time via ARG; null when unset.
        db_version:
          type: string
          description: Latest applied migration version from schema_migrations.

    RegistrationAttributes:
      type: object
      properties:
        account_name:   { type: string }
        account_slug:   { type: string }
        owner_email:    { type: string, format: email }
        api_token:      { type: string, description: "Plaintext bearer token. Shown exactly once." }
        api_token_name: { type: string }

paths:
  /api/status:
    get:
      operationId: get-api-status
      summary: Returns application version and database migration state. No authentication required.
      security: []
      responses:
        '200':
          description: Application status
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/StatusAttributes'

  /api/registrations:
    post:
      operationId: post-api-registrations
      summary: Creates a new account, owner user, and API token. No authentication required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration:
                  type: object
                  required: [email_address]
                  properties:
                    email_address:  { type: string, format: email }
                    api_token_name: { type: string }
                    account_name:   { type: string }
      responses:
        '201':
          description: Account and token created
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/RegistrationAttributes'
        '422':
          description: Validation failure (blank/duplicate/invalid email)
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '429':
          description: Rate limit exceeded
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'

  /api/agents:
    get:
      operationId: get-api-agents
      summary: Lists agents for the current account.
      parameters:
        - { name: "query", in: query, schema: { type: string } }
        - { name: "page[number]", in: query, schema: { type: integer, default: 1 } }
        - { name: "page[size]", in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated list of agents
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/AgentAttributes'
                  links:
                    $ref: '#/components/schemas/JsonApiLinks'
                  meta:
                    $ref: '#/components/schemas/JsonApiPaginationMeta'

  /api/platforms:
    get:
      operationId: get-api-platforms
      summary: Lists platforms available to the current account (built-in and custom).
      parameters:
        - { name: "page[number]", in: query, schema: { type: integer, default: 1 } }
        - { name: "page[size]", in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated list of platforms
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/PlatformAttributes'
                  links:
                    $ref: '#/components/schemas/JsonApiLinks'
                  meta:
                    $ref: '#/components/schemas/JsonApiPaginationMeta'

  /api/task_kinds:
    get:
      operationId: get-api-task-kinds
      summary: Lists built-in and account-custom task kinds.
      parameters:
        - { name: "page[number]", in: query, schema: { type: integer, default: 1 } }
        - { name: "page[size]", in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated list of task kinds
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/TaskKindAttributes'
                  links:
                    $ref: '#/components/schemas/JsonApiLinks'
                  meta:
                    $ref: '#/components/schemas/JsonApiPaginationMeta'
    post:
      operationId: post-api-task-kinds
      summary: Creates a custom task kind scoped to the current account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_kind:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: Unique name for the task kind within the account
      responses:
        '201':
          description: Created task kind
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/TaskKindAttributes'
        '422':
          description: Validation failed (e.g. name already taken)
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'

  /api/pipelines:
    get:
      operationId: get-api-pipelines
      summary: Lists built-in and account-custom pipelines.
      parameters:
        - { name: "page[number]", in: query, schema: { type: integer, default: 1 } }
        - { name: "page[size]", in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated list of pipelines
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/PipelineAttributes'
                  links:
                    $ref: '#/components/schemas/JsonApiLinks'
                  meta:
                    $ref: '#/components/schemas/JsonApiPaginationMeta'
    post:
      operationId: post-api-pipelines
      summary: Creates a custom pipeline scoped to the current account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pipeline:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: Pipeline name, unique within account
                    description:
                      type: string
                      description: Human-readable description
                    kind:
                      type: string
                      description: Task kind name to associate with the pipeline
                    stages:
                      type: array
                      items:
                        $ref: '#/components/schemas/PipelineStageInput'
                      description: "Ordered workflow stages. Full attribute set; all fields optional except name/instructions for custom stages."
      responses:
        '201':
          description: Created pipeline
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/PipelineAttributes'
        '422':
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'

  /api/pipelines/{id}:
    get:
      operationId: get-api-pipeline
      summary: Returns a single pipeline including its workflow stages.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Pipeline ID }
      responses:
        '200':
          description: Pipeline record with stages
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/PipelineAttributes'
        '404':
          description: Pipeline not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
    patch:
      operationId: patch-api-pipeline
      summary: Updates a custom pipeline. When stages are provided, replaces all workflow stages atomically.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Pipeline ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pipeline:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                    kind: { type: string }
                    stages:
                      type: array
                      items:
                        $ref: '#/components/schemas/PipelineStageInput'
                      description: "Ordered workflow stages. Replaces all existing atomically. Send empty array to clear."
      responses:
        '200':
          description: Updated pipeline
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/PipelineUpdateResponseAttributes'
        '404':
          description: Pipeline not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '422':
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'

  /api/pipelines/{pipeline_id}/clone:
    post:
      operationId: post-api-pipeline-clone
      summary: Clones a built-in or custom pipeline into the current account.
      parameters:
        - { name: pipeline_id, in: path, required: true, schema: { type: string }, description: ID of the pipeline to clone }
      responses:
        '201':
          description: Cloned pipeline
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
