  "/api/containers/{container_id}/agent_sessions":
    post:
      operationId: post-api-container-agent-session
      summary: Claim a preassigned agent invocation
      description: Claims the exact AgentSession UUID assigned by LoopControl before
        the agent starts and projected into the container at /task/agent-session-id.
        The endpoint never creates or selects an AgentSession. The UUID must belong
        to the authenticated account, container, attached task, and selected agent;
        the task must be in an active container-backed stage with no lifecycle role
        and no unapproved human gate; the selected agent must still own the container;
        and the session must be assigned or already started. Unapproved gates and
        changed agent ownership return 404. The session must carry the current persisted
        pipeline transition identity. Legacy sessions with no transition identity
        and sessions from earlier invocations of the same stage return 404. Claiming
        alone creates no billable execution entitlement. A valid assignment can be
        claimed before the container database status synchronizes to running. Claiming
        an assigned session changes it to started and emits agent.session_started.
        Repeating the claim for that same started session is idempotent and emits
        no duplicate event.
      parameters:
      - name: container_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - agent_session_id
              properties:
                agent_session_id:
                  type: string
                  format: uuid
                  description: Exact UUID projected into the container at /task/agent-session-id.
              x-loopcontrol-open-reason: ignored_inputs
              x-loopcontrol-input-policy: Unknown top-level input keys are tolerated
                and discarded. Listed properties define the consumed input vocabulary,
                enforced independently by source and runtime observation.
      responses:
        '201':
          description: The preassigned session was claimed or had already been claimed.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - type
                    - id
                    - attributes
                    - links
                    properties:
                      type:
                        type: string
                        enum:
                        - agent_sessions
                      id:
                        type: string
                      attributes:
                        "$ref": "#/components/schemas/AgentSessionStartedAttributes"
                      links:
                        type: object
                        required:
                        - self
                        properties:
                          self:
                            type: string
                            nullable: true
                        additionalProperties: false
                    additionalProperties: false
                additionalProperties: false
        '400':
          description: The required agent_session_id parameter is missing
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: The bearer token is missing or invalid
        '404':
          description: The container or session is not visible, or its account, task,
            agent, state, or persisted pipeline transition does not match the current
            invocation
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/Errors"
          "$ref": "#/components/responses/NotFound"
      x-loopcontrol-contract:
        scenarios:
          success:
            status: 201
            setup:
            - agent_session
            media_type: application/vnd.api+json
            body:
              agent_session_id:
                fixture:
                  resource: agent_session
          unauthenticated:
            status: 401
            setup:
            - unauthenticated
            body:
              agent_session_id: 00000000-0000-0000-0000-000000000000
          missing:
            status: 404
            setup:
            - authenticated
            path:
              container_id: '999999999'
            media_type: application/vnd.api+json
            body:
              agent_session_id: 00000000-0000-0000-0000-000000000000
          error_400:
            status: 400
            setup:
            - authenticated
            body: {}
          missing_agent_session_id_json:
            status: 400
            setup:
            - agent_session
            media_type: application/vnd.api+json
            body:
              agent_session_id:
                fixture:
                  resource: agent_session
            omit_body_field: agent_session_id
            request_media_type: application/json
          unknown_input:
            status: 201
            setup:
            - agent_session
            media_type: application/vnd.api+json
            body:
              agent_session_id:
                fixture:
                  resource: agent_session
              contract_ignored_input: discarded
          authentication_apiKeyAuth:
            status: 201
            setup:
            - agent_session
            media_type: application/vnd.api+json
            body:
              agent_session_id:
                fixture:
                  resource: agent_session
            authentication: apiKeyAuth
          authentication_browserSession:
            status: 201
            setup:
            - agent_session
            media_type: application/vnd.api+json
            body:
              agent_session_id:
                fixture:
                  resource: agent_session
            authentication: browserSession
        input_constraints:
        - field: ''
          operation: require
          arguments:
          - ":agent_session_id"
  "/api/agent_sessions/{id}":
    patch:
      operationId: patch-api-agent-session
      summary: Report invocation failure
      description: 'Accepts state failed, an optional integer exit_code, and an optional
        reason string. The service derives a bounded, redacted summary and safe reason
        code; retries are idempotent. A reason prefixed with startup: reports a prelaunch
        failure for the current unlaunched attempt, including the brief claim-to-exec
        window, without retaining a started_at timestamp. Stale startup reports are
        ignored. Deterministic workspace errors block and retain the workspace; eligible
        transient errors stop the old container before bounded replacement. Successful
        stage completion is reported only through POST /api/tasks/{task_id}/stage_completion.'
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - failed
                exit_code:
                  type: integer
                  nullable: true
                reason:
                  type: string
                  nullable: true
              additionalProperties: true
              x-loopcontrol-open-reason: ignored_inputs
              x-loopcontrol-input-policy: Unknown top-level input keys are tolerated
                and discarded. Listed properties define the consumed input vocabulary,
                enforced independently by source and runtime observation.
      responses:
        '200':
          description: Failed agent session
          content: &1
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - type
                    - id
                    - attributes
                    - links
                    properties:
                      type:
                        type: string
                        enum:
                        - agent_sessions
                      id:
                        type: string
                      attributes:
                        "$ref": "#/components/schemas/AgentSessionFailedAttributes"
                      links:
                        type: object
                        required:
                        - self
                        properties:
                          self:
                            type: string
                            nullable: true
                        additionalProperties: false
                    additionalProperties: false
                additionalProperties: false
        '422':
          description: State is not failed
          content: &2
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/JsonApiErrors"
          "$ref": "#/components/responses/UnprocessableEntity"
        '404': &3
          "$ref": "#/components/responses/NotFound"
        '401': &4
          "$ref": "#/components/responses/Unauthorized"
        '400':
          "$ref": "#/components/responses/BadRequest"
      x-loopcontrol-contract: &5
        scenarios:
          success:
            status: 200
            setup:
            - agent_session
            body:
              state: failed
              exit_code: 0
              reason: completed
            media_type: application/vnd.api+json
          invalid:
            status: 422
            setup:
            - agent_session
            body:
              state: invalid
            media_type: application/vnd.api+json
          unauthenticated:
            status: 401
            setup:
            - unauthenticated
            path:
              id: 00000000-0000-0000-0000-000000000000
            body:
              state: failed
          missing:
            status: 404
            setup:
            - authenticated
            path:
              id: '999999999'
            body:
              state: finished
            media_type: application/vnd.api+json
          missing_state_json:
            status: 400
            setup:
            - agent_session
            body:
              state: failed
              exit_code: 0
              reason: completed
            media_type: application/vnd.api+json
            omit_body_field: state
            request_media_type: application/json
          unknown_input:
            status: 200
            setup:
            - agent_session
            body:
              state: failed
              exit_code: 0
              reason: completed
              contract_ignored_input: discarded
            media_type: application/vnd.api+json
          authentication_apiKeyAuth:
            status: 200
            setup:
            - agent_session
            body:
              state: failed
              exit_code: 0
              reason: completed
            media_type: application/vnd.api+json
            authentication: apiKeyAuth
          authentication_browserSession:
            status: 200
            setup:
            - agent_session
            body:
              state: failed
              exit_code: 0
              reason: completed
            media_type: application/vnd.api+json
            authentication: browserSession
        input_constraints:
        - field: ''
          operation: require
          arguments:
          - ":state"
    put:
      operationId: put-api-agent-session
      summary: Report invocation failure
      description: 'Accepts state failed, an optional integer exit_code, and an optional
        reason string. The service derives a bounded, redacted summary and safe reason
        code; retries are idempotent. A reason prefixed with startup: reports a prelaunch
        failure for the current unlaunched attempt, including the brief claim-to-exec
        window, without retaining a started_at timestamp. Stale startup reports are
        ignored. Deterministic workspace errors block and retain the workspace; eligible
        transient errors stop the old container before bounded replacement. Successful
        stage completion is reported only through POST /api/tasks/{task_id}/stage_completion.'
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - failed
                exit_code:
                  type: integer
                  nullable: true
                reason:
                  type: string
                  nullable: true
              additionalProperties: true
              x-loopcontrol-open-reason: ignored_inputs
              x-loopcontrol-input-policy: Unknown top-level input keys are tolerated
                and discarded. Listed properties define the consumed input vocabulary,
                enforced independently by source and runtime observation.
      responses:
        '200':
          description: Failed agent session
