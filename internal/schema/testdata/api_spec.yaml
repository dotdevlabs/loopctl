  /api/tasks/{task_id}/recordings:
    get:
      operationId: get-api-task-recordings
      summary: Lists task recordings with authenticated content links.
      description: >-
        Account/task scoped; ordered by started_at descending. Bearer or X-Api-Token authentication,
        with an existing signed browser session as fallback. Pagination applies only to metadata.
        page must be an object; number/size must contain decimal digits when nonblank.
        Omitted number/size default to 1/20; zero clamps to 1, size above 100 clamps to 100.
        Blank values clamp to 1. Negative, fractional, nonnumeric or nested values return 400.
        prev/next links are null at page boundaries; out-of-range pages return an empty data array.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
        - { name: 'page[number]', in: query, required: false, schema: { type: integer, default: 1, minimum: 0 } }
        - { name: 'page[size]', in: query, required: false, schema: { type: integer, default: 20, minimum: 0 }, description: Normalized to 1 through 100. }
      responses:
        '200':
          description: Paginated recording metadata; content_url is relative to the authenticated API origin.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingCollection' }
        '400':
          description: Invalid pagination shape or number/size. Error source.parameter identifies page, page[number] or page[size].
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/JsonApiErrors' }
        '401':
          description: No usable token or authenticated session. Empty response body, no redirect.
        '404':
          description: Task unknown or outside authenticated account.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingScopedNotFound' }
    post:
      operationId: post-api-task-recordings
      summary: Uploads recording metadata and optionally an attached file.
      description: >-
        Account/task scoped. Bearer or X-Api-Token authentication, with an existing signed browser
        session as fallback. Accepts multipart attachment uploads or JSON path-only metadata.
        A nonblank filename and supported recording_type plus an attached file or path are required.
        Response uses the same complete recording resource as show, including content_url.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RecordingMultipartUpload' }
          application/json:
            schema: { $ref: '#/components/schemas/RecordingUpload' }
      responses:
        '201':
          description: Created recording metadata; attached supported content is immediately discoverable.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingDocument' }
        '401':
          description: No usable token or authenticated session. Empty response body, no redirect.
        '404':
          description: Task unknown or outside authenticated account.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingScopedNotFound' }
        '422':
          description: Validation failed, including unsupported/missing type, blank filename or no attached file/path.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/JsonApiErrors' }

  /api/tasks/{task_id}/recordings/{id}:
    get:
      operationId: get-api-task-recording
      summary: Returns recording metadata with an authenticated content link when available.
      description: Account/task scoped. Bearer or X-Api-Token authentication, with an existing signed browser session as fallback. Resolve content_url against the API origin and reuse authentication.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Recording metadata.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingDocument' }
        '401':
          description: No usable token or authenticated session. Empty response body, no redirect.
        '404':
          description: Task or recording unknown or outside the authenticated account/task.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingScopedNotFound' }

  /api/tasks/{task_id}/recordings/{recording_id}/content:
    get:
      operationId: get-api-task-recording-content
      summary: Returns complete original transcript JSONL or asciinema bytes.
      description: >-
        Account/task scoped. Bearer or X-Api-Token authentication, with an existing signed browser
        session as fallback for playback. Authentication and scoped lookup precede content checks.
        Returns the original attached bytes synchronously, regardless of Accept, without JSON:API wrapping,
        parsing, normalization, truncation, range handling or public download redirects.
        Transcripts always use application/x-ndjson. Asciinema preserves the stored MIME only for application/json, application/x-asciicast,
        application/octet-stream and text/plain, falling back to application/json when absent or
        outside this safe allowlist. Executable historical MIME never enables inline HTML or SVG.
        Unsupported legacy type is checked before deletion, then attachment/storage availability.
        file_available is not a storage health probe: a previously discovered link can return 404/410.
        Unexpected storage outages are not translated to missing-file errors and have no recovery guarantee.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
        - { name: recording_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Exact raw bytes, including every JSONL record or asciinema event.
          headers:
            Content-Disposition:
              description: Inline delivery retains browser playback.
              schema: { type: string, enum: [inline] }
            Cache-Control:
              description: Private response that must not be stored.
              schema: { type: string, example: 'private, no-store' }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
            application/x-asciicast:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        '401':
          description: No usable token or authenticated session. Empty response body, no redirect.
        '404':
          description: Scoped lookup failed, or attachment/physical storage object is absent. No filesystem fallback.
          content:
            application/vnd.api+json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/RecordingScopedNotFound' }
                  - { $ref: '#/components/schemas/RecordingContentError' }
              examples:
                scoped:
                  value: { errors: [{ title: Error, detail: The requested resource was not found }] }
                missing:
                  value: { error: Recording content not found }
        '410':
          description: Deleted recording file, whether still attached or already purged.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingContentError' }
              example: { error: Recording file has been deleted }
        '422':
          description: Unsupported legacy recording type.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/RecordingContentError' }
              example: { error: Recording type does not support content }

