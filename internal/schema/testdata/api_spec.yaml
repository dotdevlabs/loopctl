            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
    put:
      <<: *account-pipeline-default-update-operation
      operationId: put-api-account-pipeline-default
    delete:
      operationId: delete-api-account-pipeline-default
      summary: Clears the default pipeline for a task kind. Idempotent.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Default cleared (or was already absent)
        '404':
          description: Unknown task kind

  /api/billing/topup_packages:
    get:
      operationId: get-api-billing-topup-packages
      summary: Lists all available compute-hour top-up packages.
      responses:
        '200':
          description: All available top-up packages.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JsonApiResource'
                        - type: object
                          properties:
                            attributes:
                              $ref: '#/components/schemas/TopupPackageAttributes'

  /api/billing/topups:
    post:
      operationId: post-api-billing-topups
      summary: Creates a Stripe Checkout Session for a top-up package.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id:
                  type: string
                  description: "Top-up package identifier. Valid values: trial_5h (one-time per account), 10h, 50h, 100h."
      responses:
        '201':
          description: Checkout session created.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/TopupCheckoutAttributes'
        '422':
          description: Invalid package_id supplied.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'

  /api/billing/usdc_payments:
    post:
      operationId: post-api-billing-usdc-payments
      summary: Records an on-chain USDC payment and credits the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, tx_hash, usdc_amount_cents, minutes]
              properties:
                account_id:
                  type: integer
                  description: Account to credit.
                tx_hash:
                  type: string
                  description: On-chain transaction hash (used as idempotency key).
                usdc_amount_cents:
                  type: integer
                  description: USDC amount received in hundredths of a cent.
                minutes:
                  type: integer
                  description: Minutes to credit to the account's balance.
      responses:
        '201':
          description: Settlement accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, type, attributes]
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                        enum: [settlements]
                      attributes:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [accepted]
        '401':
          description: Missing or invalid bearer token.
  /api/billing/x402_payments:
    post:
      operationId: post-api-billing-x402-payments
      summary: >-
        Verifies an x402 on-chain USDC payment on Arbitrum via the self-hosted
        facilitator, credits compute minutes, and enqueues USDC→BTC conversion.
        Clients must include the signed payment payload in the X-PAYMENT header.
      parameters:
        - in: query
          name: package_id
          required: true
          schema: { type: string }
          description: The fundable product to purchase (e.g. "10h").
      requestBody:
        description: No body required; payment payload is in X-PAYMENT header.
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Payment verified and minutes credited.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, type, attributes]
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum: [settlements]
                      attributes:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [accepted]
                          minutes_credited:
                            type: integer
        '402':
          description: X-PAYMENT header missing or payment invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '422':
          description: Unknown or ineligible package_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '401':
          description: Missing or invalid bearer token.
        '503':
          description: Facilitator service unavailable.

  /api/billing/l402_payments:
    post:
      operationId: post-api-billing-l402-payments
      summary: >-
        Verifies an L402 Lightning payment (macaroon + preimage) via the managed
        self-custodial Lightning backend, and credits compute minutes.
        Clients include credentials in the Authorization header as
        "L402 <macaroon_base64>:<preimage_hex>".
        Invoices expire; refresh the funding_envelope before retrying with a stale invoice.
      parameters:
        - in: query
          name: package_id
          required: true
          schema: { type: string }
          description: The fundable product to purchase (e.g. "10h").
      requestBody:
        description: No body required; L402 credentials are in the Authorization header.
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Payment verified and minutes credited.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, type, attributes]
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        enum: [settlements]
                      attributes:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [accepted]
                          minutes_credited:
                            type: integer
        '402':
          description: Authorization header missing, malformed, or payment invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '422':
          description: Unknown or ineligible package_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
        '401':
          description: Missing or invalid bearer token.
        '503':
          description: Lightning backend unavailable.

  /api/billing/funding_envelope:
    get:
      operationId: get-api-billing-funding-envelope
      summary: >-
        Returns HTTP 402 with a machine-readable menu of fundable products and
        enabled payment rails. Callers use this to decide what to buy and how
        to pay when the account has insufficient compute balance.
      responses:
        '402':
          description: Payment required — returns fundable products and payment rails
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { type: string }
                        title:  { type: string }
                        detail: { type: string }
                  meta:
                    $ref: '#/components/schemas/FundingEnvelopeMeta'
        '401':
          description: Missing or invalid bearer token
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrors'
