---
openapi: 3.0.3
info:
  title: LoopControl API
  version: 1.2.0
  description: API for managing containerized agent environments on a Kubernetes cluster.
servers:
- url: "/"
security:
- bearerAuth: []
- apiKeyAuth: []
- browserSession: []
x-action-cable-machine-events:
  channel: MachineEventsChannel
  authentication: Uses the authenticated connection account; task subscriptions require
    an owned task_id.
  subscriptions:
    account:
      parameters: {}
      stream: account:<authenticated-account-id>:machine_events
    task:
      parameters:
        task_id:
          type: integer
          required: true
      stream: task:<owned-task-id>:machine_events
  delivery: Live frames are best-effort; reconnect through the replay endpoints using
    the last exclusive cursor and deduplicate by id or cursor.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceAuthorization:
      type: http
      scheme: bearer
      description: Attempt-specific, 15-minute signed callback credential issued only
        to the temporary Codex device-authentication pod. It is not an account API
        token and cannot access any other endpoint.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Token
      description: Used when Authorization is absent or does not start with Bearer.
    browserSession:
      type: apiKey
      in: cookie
      name: session_id
      description: Signed Rails session cookie; fallback when no active API token
        is found.
  schemas:
    MachineEvent:
      type: object
      required:
      - id
      - cursor
      - type
      - schema_version
      - occurred_at
      - account_id
      - project_id
      - task_id
      - container_id
      - agent_id
      - session_id
      - data
      properties:
        id:
          type: string
          format: uuid
        cursor:
          type: integer
        type:
          type: string
          enum:
          - task.created
          - task.stage_changed
          - task.picked_up
          - task.released
          - task.stage_completion_requested
          - task.stage_completion_accepted
          - task.stage_completion_rejected
          - task.blocked
          - task.unblocked
          - container.status_changed
          - container.deployment_changed
          - agent.assigned
          - agent.session_started
          - agent.session_finished
          - agent.session_failed
          - agent.session_stalled
          - agent.session_reaped
          - agent.session_restarted
          - agent.stream_started
          - agent.stream_stopped
        schema_version:
          type: integer
          enum:
          - 1
        occurred_at:
          type: string
          format: date-time
        account_id:
          type: integer
        project_id:
          type: integer
          nullable: true
        task_id:
          type: integer
          nullable: true
        container_id:
          type: integer
          nullable: true
        agent_id:
          type: integer
          nullable: true
        session_id:
          type: string
          format: uuid
          nullable: true
        data:
          oneOf:
          - "$ref": "#/components/schemas/TaskStateEventData"
          - "$ref": "#/components/schemas/TaskStageChangedEventData"
          - "$ref": "#/components/schemas/TaskContainerEventData"
          - "$ref": "#/components/schemas/TaskCompletionEventData"
          - "$ref": "#/components/schemas/TaskBlockedEventData"
          - "$ref": "#/components/schemas/ContainerStatusEventData"
          - "$ref": "#/components/schemas/ContainerDeploymentEventData"
          - "$ref": "#/components/schemas/AgentEventData"
      additionalProperties: false
    TaskStateEventData:
      type: object
      required:
      - stage
      - phase
      - terminal
      properties:
        stage:
          type: string
        phase:
          type: string
          enum:
          - active
          - paused
          - lifecycle
        lifecycle_role:
          type: string
          nullable: true
          enum:
          - ready
          - blocked
          - completed
          - rejected
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        terminal:
          type: boolean
      additionalProperties: false
    TaskStageChangedEventData:
      type: object
      required:
      - stage
      - phase
      - terminal
      - transition_id
      - from_stage
      - to_stage
      properties:
        stage:
          type: string
        phase:
          type: string
          enum:
          - active
          - paused
          - lifecycle
        lifecycle_role:
          type: string
          nullable: true
          enum:
          - ready
          - blocked
          - completed
          - rejected
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        terminal:
          type: boolean
        transition_id:
          type: integer
        from_stage:
          type: string
          nullable: true
        to_stage:
          type: string
        actor:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
              enum:
              - user
            id:
              type: integer
          additionalProperties: false
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        rework:
          type: object
          additionalProperties: true
          x-loopcontrol-open-reason: free_form
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
      additionalProperties: false
    TaskContainerEventData:
      type: object
      required:
      - container_id
      - reason
      properties:
        container_id:
          type: integer
        reason:
          type: string
      additionalProperties: false
    TaskCompletionEventData:
      type: object
      required:
      - stage
      properties:
        stage:
          type: string
          nullable: true
        result:
          type: string
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        has_summary:
          type: boolean
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        has_message:
          type: boolean
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        outcome:
          type: string
          enum:
          - advanced
          - awaiting_human_gate
          - waiting_on_requirements
          - rework
          - blocked
          - rejected
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        to_stage:
          type: string
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        gate:
          type: string
          enum:
          - human
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        waiting_on:
          type: array
          items:
            type: string
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        reason:
          type: string
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        rework:
          type: boolean
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
      additionalProperties: false
    TaskBlockedEventData:
      type: object
      required:
      - transition_id
      - reason
      properties:
        transition_id:
          type: integer
        reason:
          type: string
      additionalProperties: false
    ContainerStatusEventData:
      type: object
      required:
      - transition_id
      - from
      - to
      properties:
        transition_id:
          type: integer
        from:
          type: string
        to:
          type: string
        reason:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        status_message:
          type: string
          nullable: true
          maxLength: 500
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        error:
          nullable: true
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
      additionalProperties: false
    ContainerDeploymentEventData:
      type: object
      required:
      - changes
      properties:
        changes:
          type: object
          additionalProperties:
            type: object
            required:
            - from
            - to
            properties:
              from:
                type: string
                nullable: true
              to:
                type: string
                nullable: true
            additionalProperties: false
      additionalProperties: false
    AgentEventData:
      type: object
      required:
      - stage
      properties:
        stage:
          type: string
        resolution_source:
          type: string
          enum:
          - stage
          - project
          - account
          - fallback
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        exit_code:
          type: integer
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
        reason:
          type: string
          maxLength: 80
          x-loopcontrol-optional-reason: Event-specific metadata; present only when
            supplied by the lifecycle event producer, including historical persisted
            events.
      additionalProperties: false
    AgentSessionStartedAttributes:
      type: object
      additionalProperties: false
      required:
      - session_id
      - state
      - stage
      - task_id
      - container_id
      - agent_id
      properties:
        session_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - started
        stage:
          type: string
        task_id:
          type: integer
          format: int64
        container_id:
          type: integer
          format: int64
        agent_id:
          type: integer
          format: int64
    AgentSessionFailedAttributes:
      type: object
      additionalProperties: false
      required:
      - session_id
      - state
      - stage
      - task_id
      - container_id
      - agent_id
      properties:
        session_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - failed
        stage:
          type: string
        task_id:
          type: integer
          format: int64
        container_id:
          type: integer
          format: int64
        agent_id:
          type: integer
          format: int64
    CredentialDeviceAuthorizationAttributes:
      type: object
      additionalProperties: false
      required:
      - state
      - expires_at
      properties:
        state:
          type: string
          enum:
          - starting
          - waiting
          - completed
          - failed
          - expired
          - superseded
        expires_at:
          type: string
          format: date-time
    CredentialDeviceAuthorizationResource:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - attributes
      - links
      properties:
        type:
          type: string
          enum:
          - credential_device_authorizations
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        attributes:
          "$ref": "#/components/schemas/CredentialDeviceAuthorizationAttributes"
        links:
          type: object
          additionalProperties: false
          required:
          - self
          properties:
            self:
              type: string
              format: uri
    Errors:
      type: object
      additionalProperties: false
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - title
            - detail
            properties:
              title:
                type: string
              detail:
                type: string
              source:
                "$ref": "#/components/schemas/JsonApiErrorSource"
                x-loopcontrol-optional-reason: Only errors associated with an input
                  parameter or model attribute include a source.
    MachineEventPage:
      type: object
      required:
      - events
      - next_cursor
      - has_more
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/MachineEvent"
        next_cursor:
          type: integer
        has_more:
          type: boolean
      additionalProperties: false
    JsonApiResource:
      type: object
      required:
      - type
      - id
      - attributes
      - links
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          type: object
          additionalProperties: false
        links:
          type: object
          required:
          - self
          properties:
            self:
              type: string
              nullable: true
          additionalProperties: false
      additionalProperties: false
    JsonApiLinks:
      description: Navigation links preserve all request query parameters, including filters and page siblings, replacing only page[number] and page[size]. The self link preserves the original request URL.
      type: object
      required:
      - self
      - first
      - last
      - prev
      - next
      properties:
        self:
          type: string
        first:
          type: string
        last:
          type: string
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
      additionalProperties: false
    JsonApiPaginationMeta:
      type: object
      required:
      - total_count
      - page_count
      - current_page
      - per_page
      properties:
        total_count:
          type: integer
        page_count:
          type: integer
        current_page:
          type: integer
        per_page:
          type: integer
      additionalProperties: false
    JsonApiErrors:
      type: object
      additionalProperties: false
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            oneOf:
            - "$ref": "#/components/schemas/JsonApiStatusError"
            - "$ref": "#/components/schemas/JsonApiModelError"
    JsonApiStatusError:
      description: Errors emitted by the API error helper always include HTTP status.
      type: object
      additionalProperties: false
      required:
      - status
      - title
      - detail
      properties:
        status:
          type: string
          pattern: "^[1-5][0-9][0-9]$"
        title:
          type: string
        detail:
          type: string
        source:
          "$ref": "#/components/schemas/JsonApiErrorSource"
          x-loopcontrol-optional-reason: Only errors associated with an input parameter
            or model attribute include a source.
    JsonApiModelError:
      description: ActiveModel errors emitted by Api::ErrorSerializer omit HTTP status.
      type: object
      additionalProperties: false
      required:
      - title
      - detail
      properties:
        title:
          type: string
          enum:
          - Error
        detail:
          type: string
        source:
          "$ref": "#/components/schemas/JsonApiErrorSource"
          x-loopcontrol-optional-reason: Only errors associated with an input parameter
            or model attribute include a source.
    JsonApiErrorSource:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - parameter
        properties:
          parameter:
            type: string
      - type: object
        additionalProperties: false
        required:
        - pointer
        properties:
          pointer:
            type: string
    JsonApiToOneRelationship:
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
            id:
              type: string
          additionalProperties: false
      additionalProperties: false
      required:
      - data
    JsonApiNullableToOneRelationship:
      type: object
      properties:
        data:
          nullable: true
          type: object
          properties:
            type:
              type: string
            id:
              type: string
          additionalProperties: false
          required:
          - type
          - id
      additionalProperties: false
      required:
      - data
    AgentAttributes:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      additionalProperties: false
      required:
      - name
      - slug
    PlatformAttributes:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
        container_image:
          type: string
        needs_database:
          type: boolean
          nullable: true
        port:
          type: integer
          nullable: true
        built_in:
          type: boolean
      additionalProperties: false
      required:
      - name
      - display_name
      - container_image
      - needs_database
      - port
      - built_in
    TaskKindAttributes:
      type: object
      properties:
        name:
          type: string
        built_in:
          type: boolean
        account_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - name
      - built_in
      - account_id
      - created_at
      - updated_at
    PipelineStageTrigger:
      type: object
      properties:
        timing:
          type: string
          enum:
          - before_entry
          - after_entry
          - before_exit
          - after_exit
        handler:
          type: string
          description: Ruby constant of the handler class.
        config:
          type: object
          additionalProperties: true
          x-loopcontrol-open-reason: free_form
      additionalProperties: false
      required:
      - timing
      - handler
      - config
    PromptSections:
      type: object
      additionalProperties: false
      description: Section overrides. Absent keys inherit; text replaces; empty text
        or null omits. Unknown keys are rejected. The template key aliases workflow_instructions.
      properties:
        stage_introduction:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        workflow_instructions:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        agent_instructions:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        signaling_completion:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        todo_guidance:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        important_notes:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        rules:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        decision_rules:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        lifecycle_safety:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        recovery_message:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_pending:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_previous:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_generic:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_conflict:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_heading:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_pending_heading:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_previous_heading:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        task_header:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        attachments:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        acceptance_criteria:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        platform_guidance:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        plan_context:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        reference_material:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        success_conditions:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        failure_feedback:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustments:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        todos:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        available_tools:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_entry:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        adjustment_repeated_entry:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        todo_entry:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
        template:
          type: string
          nullable: true
          x-loopcontrol-optional-reason: Only configured section overrides are returned;
            absent sections inherit defaults.
    PromptConfiguration:
      type: object
      additionalProperties: false
      description: Database-owned Mustache sections and ordered slot names. Absent
        order inherits global order; an empty array renders nothing.
      properties:
        sections:
          "$ref": "#/components/schemas/PromptSections"
          x-loopcontrol-optional-reason: Only explicitly configured sections or order
            are stored and returned.
        order:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - stage_introduction
            - workflow_instructions
            - agent_instructions
            - signaling_completion
            - todo_guidance
            - important_notes
            - rules
            - decision_rules
            - lifecycle_safety
            - recovery_message
            - adjustment_pending
            - adjustment_previous
            - adjustment_generic
            - adjustment_conflict
            - adjustment_heading
            - adjustment_pending_heading
            - adjustment_previous_heading
            - task_header
            - attachments
            - acceptance_criteria
            - platform_guidance
            - plan_context
            - reference_material
            - success_conditions
            - failure_feedback
            - adjustments
            - todos
            - available_tools
            - adjustment_entry
            - adjustment_repeated_entry
            - todo_entry
          x-loopcontrol-optional-reason: Only explicitly configured sections or order
            are stored and returned.
    PipelineStage:
      type: object
      description: A single workflow stage as returned in pipeline responses.
      properties:
        id:
          type: string
        stage_type:
          type: string
        custom_stage_name:
          type: string
          nullable: true
        gate:
          type: string
          enum:
          - automated
          - human
        on_failure:
          type: string
          enum:
          - rework
          - block
        max_rework_count:
          type: integer
          nullable: true
        rework_to_position:
          type: integer
          nullable: true
        position:
          type: integer
        agent_id:
          type: string
          nullable: true
        environment_id:
          type: string
          nullable: true
        advance_requirements:
          type: array
          items:
            type: string
        advance_notice:
          type: string
          nullable: true
        runs_in_container_override:
          type: boolean
          nullable: true
        prompt_sections:
          "$ref": "#/components/schemas/PromptSections"
        prompt_configuration:
          "$ref": "#/components/schemas/PromptConfiguration"
        stage_triggers:
          type: array
          items:
            "$ref": "#/components/schemas/PipelineStageTrigger"
        name:
          type: string
          nullable: true
          description: 'Deprecated: same as custom_stage_name.'
        role:
          type: string
          description: 'Deprecated: always ''working''.'
        instructions:
          type: string
          description: 'Deprecated: custom-stage instructions composed into the canonical
            prompt; same as prompt_sections.template.'
