  /api/tasks/{task_id}/stage_completion:
    post:
      operationId: post-api-task-stage-completion
      summary: Advances, fails, or blocks a task at its current pipeline stage.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_session_id]
              description: Credential revisions are resolved from the current agent session's server-side snapshot; credential_revision is not accepted from callers.
              properties:
                agent_session_id: { type: string, format: uuid, description: UUID claimed by the current agent process. It must belong to this task and authenticated agent. }
                result: { type: string, enum: [passed, failed, blocked], default: passed }
                message: { type: string }
                summary: { type: string }
                blocked_reason: { type: string, minLength: 1, description: Required when result is blocked. }
                credential_set_id: { type: string, description: Credential identity from the current agent session snapshot. Required when blocked_reason is credential_authentication_failed. }
                noop_reason: { type: string }
                local_head_sha: { type: string }
                remote_head_sha: { type: string }
                working_tree_clean: { type: boolean }
                working_tree_status: { type: string }
                branch_diff_files: { type: array, items: { type: string } }
                input_tokens: { type: integer }
                output_tokens: { type: integer }
              oneOf:
                - properties:
                    result: { type: string, enum: [passed, failed], default: passed }
                - required: [result, blocked_reason]
                  properties:
                    result: { type: string, enum: [blocked] }
                    blocked_reason:
                      type: string
                      minLength: 1
                      not: { enum: [credential_authentication_failed] }
                - required: [result, blocked_reason, credential_set_id]
                  properties:
                    result: { type: string, enum: [blocked] }
                    blocked_reason: { type: string, enum: [credential_authentication_failed] }
      responses:
        '200':
          description: Obsolete invocation acknowledged with the task's current state.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/TaskShowAttributes'
        '201':
          description: Task after the accepted stage result.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/JsonApiResource'
                      - type: object
                        properties:
                          attributes:
                            $ref: '#/components/schemas/TaskShowAttributes'
        '422':
          description: Guard-rejected completion or invalid state transition. Rejected submissions make no writes and can be retried by the active session.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/JsonApiErrors' }

