paths:
  "/api/events":
    get:
      operationId: get-api-events
      summary: Replay committed account machine events after an exclusive cursor.
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Ordered committed events.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MachineEventPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      x-loopcontrol-contract:
        scenarios:
          success:
            status: 200
            setup:
            - authenticated
            media_type: application/json
            query: {}
          invalid_cursor:
            status: 400
            setup:
            - authenticated
            query:
              after: invalid
            media_type: application/vnd.api+json
          unauthenticated:
            status: 401
            setup:
            - unauthenticated
            query:
              after: 1
              limit: 1
          exclusive_cursor:
            status: 200
            setup:
            - event_records
            query:
              after:
                event: 0
              limit: 1
            media_type: application/json
            assertions:
            - pointer: "/events/0/id"
              equals:
                event: 1
                field: id
            - pointer: "/next_cursor"
              equals:
                event: 1
            - pointer: "/has_more"
              equals: true
          last_cursor:
            status: 200
            setup:
            - event_records
            query:
              after:
                event: 2
              limit: 100
            media_type: application/json
            assertions:
            - pointer: "/events"
              equals: []
            - pointer: "/next_cursor"
              equals:
                event: 2
            - pointer: "/has_more"
              equals: false
          authentication_apiKeyAuth:
            status: 200
            setup:
            - authenticated
            media_type: application/json
            query: {}
            authentication: apiKeyAuth
          authentication_browserSession:
            status: 200
            setup:
            - authenticated
            media_type: application/json
            query: {}
            authentication: browserSession
        input_constraints:
        - field: after
          operation: to_s
          arguments: []
        - field: limit
          operation: clamp
          arguments:
          - '1'
          - '100'
        - field: limit
          operation: to_i
          arguments: []
  "/api/tasks/{task_id}/events":
    get:
      operationId: get-api-task-events
      summary: Replay committed events for an owned task after an exclusive cursor.
      parameters:
      - name: task_id
        in: path
