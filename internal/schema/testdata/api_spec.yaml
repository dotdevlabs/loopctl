  "/api/credential_device_authorizations/{id}":
    patch:
      operationId: patch-api-credential-device-authorization
      summary: Update a Codex device-authorization attempt
      description: Called only by the temporary Codex device-authentication pod. `waiting`
        publishes the one-time user code, `completed` atomically stores the base64-encoded
        Codex auth.json in the existing OpenAI credential set, and `failed` ends the
        attempt without changing that credential. Expired, completed, failed, or superseded
        attempts cannot replace a credential. The attempt is represented by a signed
        15-minute callback token and an expiring cache entry; it is not persisted.
      security:
      - deviceAuthorization: []
      parameters:
      - name: id
        in: path
        required: true
        description: Random nonce identifying the cached credential device-authorization
          attempt
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
              required:
              - data
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required:
                  - type
                  - id
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - credential_device_authorizations
                    id:
                      type: string
                      pattern: "^[0-9a-f]{32}$"
                    attributes:
                      oneOf:
                      - type: object
                        additionalProperties: false
                        required:
                        - state
                        - user_code
                        properties:
                          state:
                            type: string
                            enum:
                            - waiting
                          user_code:
