      operationId: get-api-task-recording-content
      summary: Returns complete original transcript JSONL or asciinema bytes.
      description: 'Account/task scoped. Bearer or X-Api-Token authentication, with
        an existing signed browser session as fallback for playback. Authentication
        and scoped lookup precede content checks. Returns the original attached bytes
        synchronously, regardless of Accept, without JSON:API wrapping, parsing, normalization,
        truncation, range handling or public download redirects. Transcripts always
        use application/x-ndjson. Asciinema preserves the stored MIME only for application/json,
        application/x-asciicast, application/octet-stream and text/plain, falling
        back to application/json when absent or outside this safe allowlist. Executable
        historical MIME never enables inline HTML or SVG. Unsupported legacy type
