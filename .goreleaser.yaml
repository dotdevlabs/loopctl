version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: loopctl
    main: ./cmd/loopctl
    binary: loopctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/dotdevlabs/ctlkit/pkg/version.Version={{.Version}}
        -X github.com/dotdevlabs/ctlkit/pkg/version.Commit={{.Commit}}
        -X github.com/dotdevlabs/ctlkit/pkg/version.Date={{.Date}}

archives:
  - id: loopctl
    ids:
      - loopctl
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: dotdevlabs
    name: loopctl
  extra_files:
    - glob: scripts/install.sh

brews:
  - name: loopctl
    repository:
      owner: dotdevlabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: dotdevlabs-bot
      email: bot@dotdevlabs.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: https://github.com/dotdevlabs/loopctl
    description: "CLI tool for managing the LoopControl platform"
    install: bin.install "loopctl"
    test: |
      system "#{bin}/loopctl version"
